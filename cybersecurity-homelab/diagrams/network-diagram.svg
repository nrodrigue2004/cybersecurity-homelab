<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Sanitized cybersecurity homelab network diagram</title>
  <desc id="desc">A Proxmox-based homelab with pfSense segmentation, Active Directory, Linux services, testing systems, Security Onion monitoring, and private remote administration.</desc>
  <style>text{font-family:Arial,sans-serif;fill:#e8eef7}.title{font-size:28px;font-weight:bold}.label{font-size:18px;font-weight:bold}.small{font-size:14px}.box{stroke:#8ea2bd;stroke-width:2;rx:12}.line{stroke:#8ea2bd;stroke-width:3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:8 7}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#8ea2bd"/></marker></defs>
  <rect width="1200" height="760" fill="#111827"/>
  <text x="600" y="42" text-anchor="middle" class="title">Enterprise Cybersecurity Homelab — Sanitized Topology</text>
  <rect x="470" y="70" width="260" height="70" fill="#1f2937" class="box"/><text x="600" y="100" text-anchor="middle" class="label">Upstream Network</text><text x="600" y="123" text-anchor="middle" class="small">Addressing omitted</text>
  <path d="M600 140 L600 185" class="line"/>
  <rect x="460" y="185" width="280" height="80" fill="#1d4ed8" class="box"/><text x="600" y="218" text-anchor="middle" class="label">pfSense Firewall / Router</text><text x="600" y="242" text-anchor="middle" class="small">Segmentation • DHCP • DNS • Policy</text>
  <path d="M600 265 L600 310" class="line"/>
  <rect x="390" y="310" width="420" height="55" fill="#374151" class="box"/><text x="600" y="344" text-anchor="middle" class="label">Internal Lab Segment &lt;LAB_SUBNET&gt;</text>
  <path d="M490 365 L230 420" class="line"/><path d="M565 365 L495 420" class="line"/><path d="M635 365 L705 420" class="line"/><path d="M710 365 L970 420" class="line"/>
  <rect x="90" y="420" width="280" height="120" fill="#1f2937" class="box"/><text x="230" y="452" text-anchor="middle" class="label">Windows Services</text><text x="230" y="480" text-anchor="middle" class="small">Windows Server / Active Directory</text><text x="230" y="504" text-anchor="middle" class="small">Windows 11 domain workstation</text>
  <rect x="385" y="420" width="220" height="120" fill="#1f2937" class="box"/><text x="495" y="452" text-anchor="middle" class="label">Linux Services</text><text x="495" y="480" text-anchor="middle" class="small">Ubuntu Server</text><text x="495" y="504" text-anchor="middle" class="small">DVWA and WebGoat</text>
  <rect x="595" y="420" width="220" height="120" fill="#1f2937" class="box"/><text x="705" y="452" text-anchor="middle" class="label">Testing Systems</text><text x="705" y="480" text-anchor="middle" class="small">Kali Linux</text><text x="705" y="504" text-anchor="middle" class="small">Metasploitable</text>
  <rect x="830" y="420" width="280" height="120" fill="#14532d" class="box"/><text x="970" y="452" text-anchor="middle" class="label">Security Onion</text><text x="970" y="480" text-anchor="middle" class="small">Zeek • Suricata • Elastic concepts</text><text x="970" y="504" text-anchor="middle" class="small">Mirrored monitoring traffic</text>
  <path d="M705 540 L705 610" class="line dashed"/><path d="M970 540 L970 610" class="line dashed"/>
  <rect x="520" y="610" width="370" height="78" fill="#312e81" class="box"/><text x="705" y="643" text-anchor="middle" class="label">Proxmox VE Host</text><text x="705" y="668" text-anchor="middle" class="small">Virtualization platform • Management details omitted</text>
  <rect x="45" y="625" width="310" height="65" fill="#3f3f46" class="box"/><text x="200" y="652" text-anchor="middle" class="label">Private Remote Administration</text><text x="200" y="675" text-anchor="middle" class="small">Tailscale design — identifiers omitted</text>
  <text x="600" y="725" text-anchor="middle" class="small">Sanitized for public documentation: credentials, IP addresses, hostnames, and management URLs removed.</text>
</svg>
